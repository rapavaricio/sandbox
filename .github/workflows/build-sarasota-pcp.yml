name: Build Sarasota PCP Public Directory

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_sarasota_pcp.py"
      - "scripts/build_sarasota_pcp_v2.py"
      - ".github/workflows/build-sarasota-pcp.yml"
  pull_request:
    paths:
      - "scripts/build_sarasota_pcp.py"
      - "scripts/build_sarasota_pcp_v2.py"
      - ".github/workflows/build-sarasota-pcp.yml"
      - "tmp/trigger-sarasota-pcp.txt"

permissions:
  contents: write

concurrency:
  group: build-sarasota-pcp-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Extract and verify Sarasota County physicians
        run: python scripts/build_sarasota_pcp_v2.py

      - name: Upload public-data extracts
        uses: actions/upload-artifact@v4
        with:
          name: sarasota-primary-care-public-data
          path: output/
          retention-days: 7

      - name: Commit generated public-data extracts
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "Update Sarasota County primary care public directory"
            git push
          fi
